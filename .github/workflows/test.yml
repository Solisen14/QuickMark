name: QuickMark validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check omr.js
          node --check sw.js
          node --check live-camera.js
          node --check live-scan.js
          node --check assessment.js
      - name: Synthetic-sheet, live stability, and scoring tests
        run: npm test
